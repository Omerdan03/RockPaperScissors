<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPS Stratego - Local Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent1: #e94560;
    --accent2: #53d8fb;
    --text: #eee;
    --text-dim: #888;
    --cell-size: 64px;
    --gold: #f5c842;
    --p1: #e94560;
    --p2: #53d8fb;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  h1 {
    margin: 18px 0 4px;
    font-size: 1.6rem;
    letter-spacing: 2px;
    color: var(--gold);
  }
  .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .screen { display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  #config-screen {
    gap: 18px;
    margin-top: 40px;
    background: var(--surface);
    padding: 36px 48px;
    border-radius: 12px;
    border: 1px solid var(--surface2);
  }
  #config-screen label { font-size: 1.1rem; }
  #config-screen select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid #334;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 1rem;
    width: 140px;
    text-align: center;
  }
  .info {
    font-size: 0.85rem;
    color: var(--text-dim);
    max-width: 340px;
    text-align: center;
    line-height: 1.5;
  }

  .btn {
    background: var(--accent1);
    color: #fff;
    border: none;
    padding: 10px 28px;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background .2s;
    font-weight: 600;
  }
  .btn:hover { background: #c33a50; }
  .btn.secondary { background: var(--surface2); }
  .btn.secondary:hover { background: #1a4a7a; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  #transition-screen {
    gap: 24px;
    margin-top: 80px;
    text-align: center;
  }
  #transition-screen h2 { font-size: 1.5rem; }
  #transition-screen p { color: var(--text-dim); max-width: 360px; line-height: 1.5; }

  #game-screen {
    gap: 10px;
    margin-top: 10px;
    width: 100%;
  }

  #turn-bar {
    font-size: 1.1rem;
    padding: 6px 20px;
    border-radius: 6px;
    font-weight: 600;
  }
  .p1-bar { background: var(--p1); }
  .p2-bar { background: var(--p2); color: #111; }

  #setup-instructions {
    font-size: 0.95rem;
    color: var(--gold);
    min-height: 1.4em;
    text-align: center;
  }

  #board {
    display: grid;
    gap: 2px;
    background: #111;
    border: 2px solid #333;
    border-radius: 4px;
    padding: 2px;
  }
  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 3px;
    position: relative;
    transition: background .15s, box-shadow .15s;
  }
  .cell.zone-p1 { background: #2a1520; }
  .cell.zone-p2 { background: #152025; }
  .cell.zone-neutral { background: #1e1e30; }
  .cell:hover { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15); }
  .cell.selected { box-shadow: inset 0 0 0 3px var(--gold) !important; background: #3a3520 !important; }
  .cell.move-target { box-shadow: inset 0 0 0 3px #4f4 !important; cursor: pointer; }
  .cell.move-target::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(68,255,68,0.35);
  }
  .cell.move-target-attack { box-shadow: inset 0 0 0 3px #f44 !important; }
  .cell.setup-target { box-shadow: inset 0 0 0 2px rgba(245,200,66,0.3); }

  .piece {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    border: 3px solid;
    flex-direction: column;
    line-height: 1;
    position: relative;
    overflow: visible;
  }
  .piece.p1 { border-color: var(--p1); background: rgba(233,69,96,0.18); }
  .piece.p2 { border-color: var(--p2); background: rgba(83,216,251,0.18); }
  .piece.revealed-enemy { box-shadow: 0 0 8px rgba(245,200,66,0.5); }
  .piece.hidden-piece .char { filter: brightness(0.6); }
  .piece.hidden-piece { opacity: 0.7; }

  /* Character body */
  .char {
    width: 22px;
    height: 26px;
    background: currentColor;
    border-radius: 6px 6px 4px 4px;
    position: relative;
    animation: char-idle 2s ease-in-out infinite;
  }
  .piece.p1 .char { color: var(--p1); }
  .piece.p2 .char { color: var(--p2); }
  .char::before {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: currentColor;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    filter: brightness(1.3);
  }
  .char::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 2px;
    width: 7px;
    height: 5px;
    background: currentColor;
    border-radius: 2px;
    box-shadow: 10px 0 0 currentColor;
    filter: brightness(0.7);
  }

  /* Scroll parchment */
  .scroll {
    position: absolute;
    width: 16px;
    height: 20px;
    background: #d4a857;
    border-radius: 2px 2px 3px 3px;
    border: 1px solid #b8942e;
    top: 50%;
    right: 2px;
    transform: translateY(-50%) scale(0);
    transform-origin: center;
    transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scroll::before {
    content: attr(data-symbol);
    font-size: 0.6rem;
    font-weight: 800;
    color: #3a2510;
  }
  [data-scroll="visible"] .scroll {
    transform: translateY(-50%) rotate(12deg) scale(1);
    opacity: 1;
  }
  [data-scroll="hidden"] .scroll {
    transform: translateY(-50%) scale(0);
    opacity: 0;
  }
  [data-scroll="revealed"] .scroll {
    transform: translateY(-50%) rotate(-5deg) scale(1);
    opacity: 1;
    box-shadow: 0 0 10px rgba(245, 200, 66, 0.6);
    background: #f0d478;
  }

  #setup-palette {
    display: flex;
    gap: 12px;
    min-height: 62px;
    align-items: center;
  }
  .palette-item {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    border: 3px solid #555;
    background: var(--surface2);
    transition: border-color .15s, transform .15s;
  }
  .palette-item:hover { border-color: var(--gold); transform: scale(1.08); }
  .palette-item.active { border-color: var(--gold); box-shadow: 0 0 12px rgba(245,200,66,0.4); transform: scale(1.1); }
  .palette-item .icon { font-size: 1.2rem; }
  .palette-item .lbl { font-size: 0.4rem; letter-spacing: 1px; }
  .palette-item .cnt { font-size: 0.55rem; color: var(--text-dim); }

  #done-setup-btn { display: none; }

  #log-container {
    width: 100%;
    max-width: 620px;
    margin-top: 8px;
  }
  #log-container h3 { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 4px; }
  #game-log {
    background: var(--surface);
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px 12px;
    max-height: 130px;
    overflow-y: auto;
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .log-entry { border-bottom: 1px solid #222; padding: 2px 0; }
  .log-entry:last-child { border-bottom: none; }
  .log-battle { color: var(--gold); }
  .log-win { color: #4f4; font-weight: 700; }
  .log-move { color: #aaa; }

  #combat-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 90;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  #combat-overlay.active { display: flex; }
  .combat-box {
    background: var(--surface);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 30px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .combat-arena {
    display: flex;
    gap: 24px;
    align-items: center;
    min-height: 120px;
  }
  .combat-vs-text {
    color: var(--gold);
    font-weight: 700;
    font-size: 1.4rem;
    z-index: 2;
  }
  .combat-char {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
  }
  .combat-char .char {
    width: 36px;
    height: 42px;
    border-radius: 8px 8px 6px 6px;
    animation: none;
  }
  .combat-char .char::before {
    width: 22px;
    height: 22px;
    top: -16px;
  }
  .combat-char .char::after {
    bottom: -7px;
    left: 4px;
    width: 10px;
    height: 7px;
    box-shadow: 14px 0 0 currentColor;
  }
  .combat-char .scroll {
    position: relative;
    width: 28px;
    height: 34px;
    top: auto;
    right: auto;
    transform: scale(0) rotate(0deg);
    transform-origin: center;
    border-radius: 3px;
    transition: none;
  }
  .combat-char .scroll::before {
    font-size: 1rem;
  }
  .combat-result { font-size: 1.1rem; font-weight: 600; }
  .combat-result.win { color: #4f4; }
  .combat-result.lose { color: #f44; }
  .combat-result.draw { color: var(--gold); }
  .combat-result.bomb { color: #f80; }

  #win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }
  #win-overlay.active { display: flex; }
  #win-overlay h2 { font-size: 2.2rem; color: var(--gold); }
  #win-overlay p { font-size: 1.1rem; }

  /* Idle animation */
  @keyframes char-idle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  @keyframes combat-enter-left {
    from { transform: translateX(-80px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes combat-enter-right {
    from { transform: translateX(80px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes combat-taunt {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-8px) scale(1.05); }
    50% { transform: translateY(0) scale(1); }
    75% { transform: translateY(-6px) scale(1.03); }
  }
  @keyframes scroll-reveal {
    from { transform: scale(0) rotate(-30deg); }
    to { transform: scale(1) rotate(0deg); }
  }
  @keyframes winner-glow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
    50% { filter: brightness(1.4) drop-shadow(0 0 12px rgba(68,255,68,0.6)); }
  }
  @keyframes loser-fade {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0.3; transform: scale(0.85); }
  }
  @keyframes draw-flash {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.5) sepia(0.5); }
  }
  @keyframes result-pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .combat-char.enter-left {
    animation: combat-enter-left 0.4s ease-out forwards;
  }
  .combat-char.enter-right {
    animation: combat-enter-right 0.4s ease-out forwards;
  }
  .combat-char.taunt .char {
    animation: combat-taunt 0.6s ease-in-out;
  }
  .combat-char.scroll-show .scroll {
    animation: scroll-reveal 0.4s ease-out forwards;
  }
  .combat-char.winner {
    animation: winner-glow 0.8s ease-in-out infinite;
  }
  .combat-char.loser {
    animation: loser-fade 0.5s ease-out forwards;
  }
  .combat-char.draw-result {
    animation: draw-flash 0.6s ease-in-out;
  }
  .combat-result.pop {
    animation: result-pop 0.3s ease-out forwards;
  }
  #combat-ok-btn.pop {
    animation: result-pop 0.3s ease-out forwards;
  }

  .piece-slide {
    position: fixed;
    z-index: 1000;
    transition: transform 0.25s ease-in-out;
    pointer-events: none;
  }
  .piece-slide .char {
    animation: none;
  }

  @media (max-width: 600px) {
    :root { --cell-size: 48px; }
    .piece { width: 40px; height: 40px; }
    .char { width: 18px; height: 20px; }
    .char::before { width: 11px; height: 11px; top: -8px; }
    .char::after { width: 6px; height: 4px; box-shadow: 8px 0 0 currentColor; }
    .scroll { width: 13px; height: 16px; }
    .scroll::before { font-size: 0.5rem; }
    .palette-item { width: 46px; height: 46px; }
    .combat-char .char { width: 28px; height: 34px; }
    .combat-char .scroll { width: 22px; height: 28px; }
  }
</style>
</head>
<body>

<h1>RPS STRATEGO</h1>
<div class="subtitle">Local Game</div>

<!-- CONFIG -->
<div id="config-screen" class="screen active">
  <label for="board-size">Board Size</label>
  <select id="board-size">
    <option value="6">6 &times; 6</option>
    <option value="8" selected>8 &times; 8</option>
    <option value="10">10 &times; 10</option>
    <option value="12">12 &times; 12</option>
  </select>
  <div id="piece-preview" class="info"></div>
  <button class="btn" id="start-btn">Start Game</button>
</div>

<!-- TRANSITION -->
<div id="transition-screen" class="screen">
  <h2 id="transition-title"></h2>
  <p id="transition-msg"></p>
  <button class="btn" id="transition-btn">Ready</button>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div id="turn-bar"></div>
  <div id="setup-instructions"></div>
  <div id="setup-palette"></div>
  <button class="btn" id="done-setup-btn">Done Placing</button>
  <div id="board"></div>
  <div id="log-container">
    <h3>Game Log</h3>
    <div id="game-log"></div>
  </div>
</div>

<!-- COMBAT POPUP -->
<div id="combat-overlay">
  <div class="combat-box">
    <div class="combat-arena">
      <div class="combat-char" id="combat-atk">
        <div class="char"></div>
        <div class="scroll" data-symbol="?"></div>
      </div>
      <div class="combat-vs-text">VS</div>
      <div class="combat-char" id="combat-def">
        <div class="char"></div>
        <div class="scroll" data-symbol="?"></div>
      </div>
    </div>
    <div id="combat-result-text" class="combat-result"></div>
    <button class="btn" id="combat-ok-btn">OK</button>
  </div>
</div>

<!-- WIN OVERLAY -->
<div id="win-overlay">
  <h2 id="win-title"></h2>
  <p id="win-msg"></p>
  <button class="btn" id="play-again-btn">Back to Menu</button>
</div>

<script>
// ===== Constants =====
const ICONS = {
  rock: '\u270A', paper: '\u270B', scissors: '\u2702\uFE0F',
  flag: '\u2691', bomb: '\uD83D\uDCA3', unknown: '?'
};
const LABELS = {
  rock: 'ROCK', paper: 'PAPER', scissors: 'SCISSORS',
  flag: 'FLAG', bomb: 'BOMB', unknown: ''
};
const SCROLL_SYMBOLS = {
  rock: 'R', paper: 'P', scissors: 'S',
  flag: 'F', bomb: 'B', unknown: '?'
};

// ===== State =====
let state = null;
let viewer = 1;
let selectedCell = null;
let validMoves = [];
let setupSelectedType = null;
let gameId = null;
let token = null;

// ===== API helpers =====
async function api(url, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) {
    if (method !== 'GET') {
      body.game_id = gameId;
      body.token = token;
      opts.body = JSON.stringify(body);
    }
  } else if (method !== 'GET') {
    opts.body = JSON.stringify({ game_id: gameId, token: token });
  }
  // For GET, append game_id and token as query params
  if (method === 'GET') {
    const sep = url.includes('?') ? '&' : '?';
    url += `${sep}game_id=${gameId}&token=${token}`;
  }
  const res = await fetch(url, opts);
  return res.json();
}

async function fetchState() {
  state = await api(`/api/state?viewer=${viewer}`);
  return state;
}

// ===== Screen management =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== Config =====
function calcPreview(size) {
  const total = size * 2;
  const remaining = total - 3;
  const base = Math.floor(remaining / 3);
  const rem = remaining % 3;
  return {
    rock: base + (rem > 0 ? 1 : 0),
    paper: base + (rem > 1 ? 1 : 0),
    scissors: base,
    flag: 1, bomb: 2, total
  };
}

function updatePreview() {
  const size = parseInt(document.getElementById('board-size').value);
  const d = calcPreview(size);
  document.getElementById('piece-preview').innerHTML =
    `Per player: ~${d.rock}${ICONS.rock} ~${d.paper}${ICONS.paper} ~${d.scissors}${ICONS.scissors} ` +
    `1${ICONS.flag} 2${ICONS.bomb}<br>Total: ${d.total} pieces each &middot; Deployment: 2 rows`;
}

document.getElementById('board-size').addEventListener('change', updatePreview);
updatePreview();

document.getElementById('start-btn').addEventListener('click', async () => {
  const size = parseInt(document.getElementById('board-size').value);
  const res = await fetch('/api/rooms/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ size, mode: 'local' }),
  });
  const data = await res.json();
  gameId = data.gameId;
  token = data.token;
  viewer = 1;
  await fetchState();
  showTransition(1, 'setup');
});

// ===== Transition =====
function showTransition(player, reason) {
  showScreen('transition-screen');
  const title = document.getElementById('transition-title');
  const msg = document.getElementById('transition-msg');
  const btn = document.getElementById('transition-btn');

  if (reason === 'setup') {
    title.textContent = `Player ${player} \u2014 Setup Phase`;
    msg.textContent = 'Place your Flag and 2 Bombs in your deployment zone (highlighted rows). ' +
      'The remaining squares will be auto-filled with Rock/Paper/Scissors pieces.';
    btn.onclick = async () => {
      viewer = player;
      await fetchState();
      beginSetup();
    };
  } else {
    title.textContent = `Player ${player}'s Turn`;
    msg.textContent = 'Pass the device to the next player. Press Ready when you are at the screen.';
    btn.onclick = async () => {
      viewer = player;
      await fetchState();
      showGame();
    };
  }
}

// ===== Setup =====
function beginSetup() {
  showScreen('game-screen');
  setupSelectedType = null;
  renderSetupUI();
  renderBoard();
  updateTurnBar();
}

function renderSetupUI() {
  const remaining = state.setupRemaining;
  const palette = document.getElementById('setup-palette');
  palette.innerHTML = '';

  const types = ['flag', 'bomb'];
  let anyLeft = false;

  types.forEach(t => {
    const count = remaining[t];
    if (count <= 0) return;
    anyLeft = true;
    const el = document.createElement('div');
    el.className = 'palette-item' + (setupSelectedType === t ? ' active' : '');
    el.innerHTML = `<span class="icon">${ICONS[t]}</span><span class="lbl">${LABELS[t]}</span><span class="cnt">&times;${count}</span>`;
    el.onclick = () => { setupSelectedType = t; renderSetupUI(); };
    palette.appendChild(el);
  });

  if (anyLeft && !setupSelectedType) {
    const avail = types.filter(t => remaining[t] > 0);
    if (avail.length === 1) {
      setupSelectedType = avail[0];
      renderSetupUI();
      return;
    }
  }

  const instrEl = document.getElementById('setup-instructions');
  const doneBtn = document.getElementById('done-setup-btn');

  if (!anyLeft) {
    instrEl.textContent = 'All pieces placed! Click "Done Placing" to auto-fill R/P/S and continue.';
    doneBtn.style.display = 'inline-block';
  } else {
    const sel = setupSelectedType ? LABELS[setupSelectedType] : '(select a piece)';
    instrEl.textContent = `Select a piece type, then click a cell in your zone. Placing: ${sel}. Right-click placed piece to remove.`;
    doneBtn.style.display = 'none';
  }
}

document.getElementById('done-setup-btn').addEventListener('click', async () => {
  const result = await api('/api/setup/done', 'POST', {});
  if (result.error) {
    alert(result.error);
    return;
  }
  document.getElementById('setup-palette').innerHTML = '';
  document.getElementById('setup-instructions').textContent = '';
  document.getElementById('done-setup-btn').style.display = 'none';

  if (result.next === 'setup') {
    showTransition(result.player, 'setup');
  } else {
    showTransition(1, 'turn');
  }
});

// ===== Board rendering =====
function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${state.size}, var(--cell-size))`;
  board.innerHTML = '';

  const p1Rows = [state.size - 2, state.size - 1];
  const p2Rows = [0, 1];
  const deployRows = viewer === 1 ? p1Rows : p2Rows;

  for (let r = 0; r < state.size; r++) {
    for (let c = 0; c < state.size; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;

      if (p1Rows.includes(r)) cell.classList.add('zone-p1');
      else if (p2Rows.includes(r)) cell.classList.add('zone-p2');
      else cell.classList.add('zone-neutral');

      if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
        cell.classList.add('selected');
      }

      const isTarget = validMoves.some(m => m.r === r && m.c === c);
      if (isTarget) {
        const targetPiece = state.grid[r][c];
        if (targetPiece) {
          cell.classList.add('move-target-attack');
        } else {
          cell.classList.add('move-target');
        }
      }

      if (state.phase === 'setup' && deployRows.includes(r) && !state.grid[r][c]) {
        cell.classList.add('setup-target');
      }

      const p = state.grid[r][c];
      if (p) {
        const pel = document.createElement('div');
        pel.className = 'piece ' + (p.owner === 1 ? 'p1' : 'p2');

        const charEl = document.createElement('div');
        charEl.className = 'char';
        charEl.style.animationDelay = `${((r * state.size + c) % 7) * 0.15}s`;
        pel.appendChild(charEl);

        const scrollEl = document.createElement('div');
        scrollEl.className = 'scroll';

        if (p.type !== 'unknown') {
          scrollEl.setAttribute('data-symbol', SCROLL_SYMBOLS[p.type] || '?');
          if (p.owner === viewer) {
            pel.setAttribute('data-scroll', 'visible');
          } else if (p.revealed) {
            pel.setAttribute('data-scroll', 'revealed');
            pel.classList.add('revealed-enemy');
          } else {
            pel.setAttribute('data-scroll', 'hidden');
          }
        } else {
          scrollEl.setAttribute('data-symbol', '?');
          pel.setAttribute('data-scroll', 'hidden');
          pel.classList.add('hidden-piece');
        }

        pel.appendChild(scrollEl);
        cell.appendChild(pel);
      }

      cell.addEventListener('click', () => onCellClick(r, c));
      cell.addEventListener('contextmenu', (e) => { e.preventDefault(); onCellRightClick(r, c); });

      board.appendChild(cell);
    }
  }
}

function updateTurnBar() {
  const bar = document.getElementById('turn-bar');
  if (state.phase === 'setup') {
    bar.textContent = `Player ${state.setupPlayer} \u2014 Setup`;
    bar.className = state.setupPlayer === 1 ? 'p1-bar' : 'p2-bar';
  } else {
    bar.textContent = `Player ${state.currentPlayer}'s Turn \u2014 Turn ${state.turnCount + 1}`;
    bar.className = state.currentPlayer === 1 ? 'p1-bar' : 'p2-bar';
  }
  bar.id = 'turn-bar';
}

function renderLog() {
  const log = document.getElementById('game-log');
  log.innerHTML = '';
  const entries = (state.log || []).slice().reverse();
  entries.forEach(text => {
    const el = document.createElement('div');
    el.className = 'log-entry';
    if (text.includes('beats') || text.includes('BOMB') || text.includes('DRAW') || text.includes('FLAG')) {
      el.classList.add('log-battle');
    } else if (text.includes('Wins') || text.includes('captured')) {
      el.classList.add('log-win');
    } else {
      el.classList.add('log-move');
    }
    el.textContent = text;
    log.appendChild(el);
  });
}

function showGame() {
  showScreen('game-screen');
  selectedCell = null;
  validMoves = [];
  renderBoard();
  updateTurnBar();
  renderLog();
}

// ===== Click handlers =====
async function onCellClick(r, c) {
  if (state.phase === 'setup') {
    await handleSetupClick(r, c);
    return;
  }
  if (state.phase !== 'play') return;

  if (validMoves.some(m => m.r === r && m.c === c)) {
    await executeMove(selectedCell.r, selectedCell.c, r, c);
    return;
  }

  const p = state.grid[r][c];
  if (p && p.owner === state.currentPlayer && p.type !== 'unknown' && p.type !== 'flag' && p.type !== 'bomb') {
    selectedCell = { r, c };
    const movesData = await api(`/api/moves?r=${r}&c=${c}`);
    validMoves = movesData.moves || [];
    renderBoard();
    return;
  }

  selectedCell = null;
  validMoves = [];
  renderBoard();
}

async function onCellRightClick(r, c) {
  if (state.phase !== 'setup') return;
  const p = state.grid[r][c];
  if (!p || p.owner !== viewer) return;
  if (p.type !== 'flag' && p.type !== 'bomb') return;

  await api('/api/setup/remove', 'POST', { r, c });
  await fetchState();
  renderSetupUI();
  renderBoard();
}

async function handleSetupClick(r, c) {
  if (!setupSelectedType) return;
  const deployRows = viewer === 1 ? [state.size - 2, state.size - 1] : [0, 1];
  if (!deployRows.includes(r)) return;
  if (state.grid[r][c]) return;

  const result = await api('/api/setup/place', 'POST', { r, c, type: setupSelectedType });
  if (result.error) return;

  await fetchState();
  if (state.setupRemaining[setupSelectedType] <= 0) {
    setupSelectedType = null;
  }
  renderSetupUI();
  renderBoard();
}

// ===== Move animation =====
function animateMove(fr, fc, tr, tc) {
  return new Promise(resolve => {
    const sourceCell = document.querySelector(`.cell[data-r="${fr}"][data-c="${fc}"]`);
    const targetCell = document.querySelector(`.cell[data-r="${tr}"][data-c="${tc}"]`);
    if (!sourceCell || !targetCell) { resolve(); return; }
    const piece = sourceCell.querySelector('.piece');
    if (!piece) { resolve(); return; }

    const srcRect = piece.getBoundingClientRect();
    const tgtRect = targetCell.getBoundingClientRect();

    const clone = piece.cloneNode(true);
    clone.classList.add('piece-slide');
    clone.style.left = srcRect.left + 'px';
    clone.style.top = srcRect.top + 'px';
    clone.style.width = srcRect.width + 'px';
    clone.style.height = srcRect.height + 'px';
    document.body.appendChild(clone);

    piece.style.visibility = 'hidden';

    const dx = tgtRect.left + (tgtRect.width - srcRect.width) / 2 - srcRect.left;
    const dy = tgtRect.top + (tgtRect.height - srcRect.height) / 2 - srcRect.top;

    // Force reflow so browser registers initial position before transition
    getComputedStyle(clone).transform;
    clone.style.transform = `translate(${dx}px, ${dy}px)`;

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      clone.remove();
      resolve();
    };
    clone.addEventListener('transitionend', finish);
    setTimeout(finish, 350);
  });
}

// ===== Move execution =====
async function executeMove(fr, fc, tr, tc) {
  const result = await api('/api/move', 'POST', { fr, fc, tr, tc });
  if (result.error) {
    alert(result.error);
    return;
  }

  selectedCell = null;
  validMoves = [];

  // Animate simple move before re-rendering
  if (result.action === 'move') {
    await animateMove(fr, fc, tr, tc);
  }

  if (result.action === 'combat' || result.action === 'bomb' || result.action === 'capture_flag') {
    await showCombatPopup(result, viewer);
  }

  await fetchState();
  renderBoard();
  renderLog();
  updateTurnBar();

  if (result.game_over || state.phase === 'over') {
    showWin(state.winner);
    return;
  }

  showTransition(state.currentPlayer, 'turn');
}

// ===== Combat popup =====
function showCombatPopup(result, attackerPlayer) {
  return new Promise(resolve => {
    const overlay = document.getElementById('combat-overlay');
    const atkContainer = document.getElementById('combat-atk');
    const defContainer = document.getElementById('combat-def');
    const atkChar = atkContainer.querySelector('.char');
    const defChar = defContainer.querySelector('.char');
    const atkScroll = atkContainer.querySelector('.scroll');
    const defScroll = defContainer.querySelector('.scroll');
    const textEl = document.getElementById('combat-result-text');
    const okBtn = document.getElementById('combat-ok-btn');
    const defenderPlayer = attackerPlayer === 1 ? 2 : 1;

    // Set player colors
    atkChar.style.color = attackerPlayer === 1 ? 'var(--p1)' : 'var(--p2)';
    defChar.style.color = defenderPlayer === 1 ? 'var(--p1)' : 'var(--p2)';

    // Reset state
    atkScroll.setAttribute('data-symbol', '?');
    defScroll.setAttribute('data-symbol', '?');
    atkContainer.className = 'combat-char';
    defContainer.className = 'combat-char';
    textEl.textContent = '';
    textEl.className = 'combat-result';
    okBtn.style.display = 'none';
    okBtn.className = 'btn';

    overlay.classList.add('active');

    // Phase 1: Enter (0-0.4s)
    atkContainer.classList.add('enter-left');
    defContainer.classList.add('enter-right');

    // Phase 2: Taunt (0.4-1.0s)
    setTimeout(() => {
      atkContainer.style.opacity = '1';
      defContainer.style.opacity = '1';
      atkContainer.classList.add('taunt');
      defContainer.classList.add('taunt');
    }, 400);

    // Phase 3: Reveal scrolls (1.0-1.6s)
    setTimeout(() => {
      atkScroll.setAttribute('data-symbol', SCROLL_SYMBOLS[result.attacker] || '?');
      defScroll.setAttribute('data-symbol', SCROLL_SYMBOLS[result.defender] || '?');
      atkContainer.classList.add('scroll-show');
      defContainer.classList.add('scroll-show');
    }, 1000);

    // Phase 4: Result (1.6-2.2s)
    setTimeout(() => {
      if (result.action === 'capture_flag') {
        textEl.textContent = `${LABELS[result.attacker]} captures the FLAG!`;
        textEl.className = 'combat-result win pop';
        atkContainer.classList.add('winner');
        defContainer.classList.add('loser');
      } else if (result.action === 'bomb') {
        textEl.textContent = `${LABELS[result.attacker]} hits a BOMB! Both destroyed!`;
        textEl.className = 'combat-result bomb pop';
        atkContainer.classList.add('loser');
        defContainer.classList.add('loser');
      } else if (result.outcome === 'win') {
        textEl.textContent = `${LABELS[result.attacker]} beats ${LABELS[result.defender]}!`;
        textEl.className = 'combat-result win pop';
        atkContainer.classList.add('winner');
        defContainer.classList.add('loser');
      } else if (result.outcome === 'lose') {
        textEl.textContent = `${LABELS[result.attacker]} loses to ${LABELS[result.defender]}!`;
        textEl.className = 'combat-result lose pop';
        atkContainer.classList.add('loser');
        defContainer.classList.add('winner');
      } else {
        textEl.textContent = `${LABELS[result.attacker]} vs ${LABELS[result.defender]} \u2014 DRAW!`;
        textEl.className = 'combat-result draw pop';
        atkContainer.classList.add('draw-result');
        defContainer.classList.add('draw-result');
      }
    }, 1600);

    // Phase 5: OK button (2.2s+)
    setTimeout(() => {
      okBtn.style.display = '';
      okBtn.classList.add('pop');
    }, 2200);

    okBtn.onclick = () => {
      overlay.classList.remove('active');
      atkContainer.className = 'combat-char';
      defContainer.className = 'combat-char';
      atkContainer.style.opacity = '';
      defContainer.style.opacity = '';
      textEl.className = 'combat-result';
      okBtn.className = 'btn';
      resolve();
    };
  });
}

// ===== Win =====
function showWin(winner) {
  const overlay = document.getElementById('win-overlay');
  document.getElementById('win-title').textContent = `Player ${winner} Wins!`;
  document.getElementById('win-msg').textContent = state.log[state.log.length - 1] || '';
  overlay.classList.add('active');
  renderBoard();
  renderLog();
}

document.getElementById('play-again-btn').addEventListener('click', () => {
  window.location.href = '/';
});
</script>
